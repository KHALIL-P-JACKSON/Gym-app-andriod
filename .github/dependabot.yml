version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns:
          - com.android.tools.build:gradle
          - org.jetbrains.kotlin*
          - com.google.devtools.ksp*
      androidx:
        patterns:
          - androidx.*
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
